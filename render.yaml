# Render Blueprint: the web service and its database, both in Frankfurt (EU).
# Values marked "sync: false" are secrets: Render asks for them when the Blueprint is created.
databases:
  - name: mojtam3na-db
    region: frankfurt
    plan: basic-256mb
    databaseName: mojtam3na_production
    user: mojtam3na

services:
  - type: web
    name: mojtam3na
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /up
    # Runs before each new version goes live. A failure here stops the deploy.
    preDeployCommand: bin/rails db:migrate db:seed legal:gate
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mojtam3na-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_LEVEL
        value: info
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      # Set to "true" before the real launch: the deploy then fails while config/legal.yml has [PLACEHOLDERS].
      - key: REQUIRE_LEGAL_COMPLETE
        value: "false"
      # APP_HOST and MAILER_FROM are added later, when the domain is ready (until then the app uses Render's address).
      - key: SMTP_ADDRESS
        value: smtp-relay.brevo.com
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: DAILY_API_KEY
        sync: false
      - key: DAILY_DOMAIN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: AR_ENCRYPTION_PRIMARY_KEY
        sync: false
      - key: AR_ENCRYPTION_DETERMINISTIC_KEY
        sync: false
      - key: AR_ENCRYPTION_KEY_DERIVATION_SALT
        sync: false
