        rejected: "لم تتم الموافقة على صورتك الأخيرة. ارفع صورة أخرى أو احتفظ بصورتك الرمزية."
        avatar_title: "الصورة الرمزية"
        avatar_intro: "يحدد اختيارك أيضاً جنسك في ملفك الشخصي. يرى أولياء الأمور هذه الصورة الرمزية إذا لم تكن لديك صورة."
        type_error: "اختر صورة بصيغة JPG أو PNG."
