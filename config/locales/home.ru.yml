        language:
          title: Язык вашего ребёнка
          text: Найдите преподавателей, которые объясняют арабский язык и Коран на языке, который ваш ребёнок понимает лучше всего.
      subjects:
        title: Чему может научиться ваш ребёнок
        text: Уроки подбираются по возрасту и уровню ребёнка.
        items:
          arabic_reading: Чтение и письмо на арабском
          quran_recitation: Чтение Корана
          tajweed: Таджвид
          memorization: Заучивание наизусть
          conversation: Разговорный арабский
      languages:
        title: Доступно на вашем языке
        text: Сайт доступен на шести языках, а уроки объясняются на языке, на котором говорит ваш ребёнок.
      faq:
        title: Частые вопросы
        trial:
          question: Как проходит пробный урок?
          answer: Вы записываетесь на короткий первый урок к выбранному преподавателю, чтобы понять, подходит ли он вам, до оформления подписки.
        arabic:
          question: Нужно ли ребёнку уже знать арабский?
          answer: Нет. Преподаватели начинают с арабского алфавита и подбирают темп под уровень ребёнка.
        parents:
          question: Могу ли я присутствовать на уроках как родитель?
          answer: Да. Родители могут присоединиться к любому уроку и видеть успехи, заметки и домашние задания в своём кабинете.
        tech:
          question: Что нужно для занятий?
          answer: Компьютер, планшет или телефон с камерой, микрофоном и стабильным интернет-соединением.
        vetting:
          question: Как проверяют преподавателей?
          answer: Преподаватели загружают документы о квалификации и сертификаты, а наша команда проверяет их до публикации профиля.
