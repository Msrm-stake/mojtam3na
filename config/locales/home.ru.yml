          text: Просматривайте преподавателей по предмету, языку, цене и расписанию и знакомьтесь с их квалификацией.
        book:
          title: Запишитесь на пробный урок
          text: Выберите удобное для вашей семьи время в вашем часовом поясе и познакомьтесь с преподавателем.
        learn:
          title: Учитесь вживую
          text: Занимайтесь на индивидуальных видеоуроках из дома, а как родитель следите за успехами, заметками и домашними заданиями.
      trust:
        title: Почему родители доверяют Mojtam3na
