        title: Available in your language
        text: The website is available in six languages, and lessons are explained in the language your child speaks.
      faq:
        title: Frequently asked questions
        trial:
          question: How does a trial lesson work?
          answer: You book a short first lesson with the teacher you chose, so you and your child can see whether it is a good fit before subscribing.
        arabic:
          question: Does my child need to know Arabic already?
          answer: No. Teachers start from the Arabic alphabet and adapt the pace to your child's level.
        parents:
          question: Can I follow the lessons as a parent?
          answer: Yes. Parents can join any lesson and see progress, notes and homework from their dashboard.
        tech:
          question: What do we need for the lessons?
          answer: A computer, tablet or phone with a camera, a microphone and a stable internet connection.
        vetting:
          question: How are teachers checked?
          answer: Teachers upload their qualifications and certificates, and our team reviews them before the profile is published.
