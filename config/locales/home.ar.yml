        subtitle: معلمون مؤهلون، ودروس فردية بالفيديو، ولوحة متابعة للوالدين لمتابعة كل خطوة في تقدم طفلك.
        find_teacher: ابحث عن معلم
        become_teacher: كن معلمًا
      how:
        title: كيف يعمل
        subtitle: من أول بحث إلى أول درس في ثلاث خطوات بسيطة.
        choose:
          title: اختر معلمًا
          text: تصفح المعلمين حسب المادة واللغة والسعر والمواعيد المتاحة، واطلع على مؤهلاتهم.
        book:
          title: احجز درسًا تجريبيًا
          text: اختر وقتًا يناسب أسرتك بحسب منطقتك الزمنية، وتعرّف على معلمك.
        learn:
          title: تعلّم مباشرة
          text: انضم إلى دروس فردية بالفيديو من المنزل، وتابع كوالد التقدم والملاحظات والواجبات.
      trust:
        title: لماذا يثق الآباء في Mojtam3na
        vetted:
          title: معلمون مؤهلون
          text: يقدّم كل معلم مؤهلاته، ويراجعها فريقنا قبل نشر ملفه الشخصي.
        parents:
          title: حسابات يديرها الوالدان
          text: أنت من ينشئ ملف طفلك وتبقى متحكمًا في الحجوزات والمدفوعات.
        safety:
          title: فصل مفتوح
          text: يمكن للوالدين الانضمام إلى أي درس.
        language:
          title: بلغة طفلك
          text: ابحث عن معلمين يشرحون العربية والقرآن باللغة التي يفهمها طفلك أفضل.
      subjects:
        title: ماذا يستطيع طفلك أن يتعلم
        text: تُكيَّف الدروس حسب عمر طفلك ومستواه.
        items:
          arabic_reading: القراءة والكتابة بالعربية
          quran_recitation: تلاوة القرآن
          tajweed: التجويد
          memorization: الحفظ
          conversation: المحادثة بالعربية
      languages:
        title: متاح بلغتك
        text: الموقع متاح بست لغات، ويتم شرح الدروس بلغة طفلك.
      faq:
        title: الأسئلة الشائعة
        trial:
          question: كيف يعمل الدرس التجريبي؟
          answer: تحجز درسًا أول قصيرًا مع المعلم الذي اخترته، لتعرف إن كان مناسبًا قبل الاشتراك.
        arabic:
          question: هل يجب أن يعرف طفلي العربية مسبقًا؟
          answer: لا. يبدأ المعلمون من الحروف الأبجدية العربية ويضبطون الوتيرة بحسب مستوى طفلك.
        parents:
          question: هل يمكنني متابعة الدروس كوالد؟
          answer: نعم. يمكن للوالدين الانضمام إلى أي درس ومشاهدة التقدم والملاحظات والواجبات من لوحة المتابعة.
        tech:
          question: ماذا نحتاج للدروس؟
          answer: حاسوب أو جهاز لوحي أو هاتف مزود بكاميرا وميكروفون واتصال إنترنت مستقر.
        vetting:
          question: كيف يتم التحقق من المعلمين؟
          answer: يرفع المعلمون مؤهلاتهم وشهاداتهم، ويراجعها فريقنا قبل نشر الملف الشخصي.
